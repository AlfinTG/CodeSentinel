services:
  postgres:
    image: postgres:16-alpine
    container_name: codesentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel_password
      POSTGRES_DB: codesentinel_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentinel -d codesentinel_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codesentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

