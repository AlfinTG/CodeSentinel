# ==============================================================================
# CodeSentinel AWS Secrets Manager IRSA (IAM Roles for Service Accounts) Manifest
# ------------------------------------------------------------------------------
# Grants the backend pod permission to resolve secrets directly from AWS Secrets
# Manager into process memory on startup, eliminating plaintext .env files on disk.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: codesentinel-backend-sa
  namespace: codesentinel
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/CodeSentinelBackendSecretsRole
---
apiVersion: iam.aws.amazon.com/v1alpha1
kind: IAMPolicy
metadata:
  name: codesentinel-secrets-read-policy
spec:
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "secretsmanager:GetSecretValue",
            "secretsmanager:DescribeSecret"
          ],
          "Resource": "arn:aws:secretsmanager:*:*:secret:codesentinel/*"
        }
      ]
    }
