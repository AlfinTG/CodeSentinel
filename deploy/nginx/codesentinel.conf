# ==============================================================================
# CodeSentinel Production Nginx Reverse Proxy Configuration (Phase 10)
#
# Enforces:
# - Strict TLS 1.3 Transport Security
# - Defense-in-depth HTTP Security Headers (CSP, HSTS, X-Content-Type-Options)
# - Token-bucket rate limiting on Webhooks (100 r/s) and API endpoints (50 r/s)
# - Unbuffered Server-Sent Events (SSE) streaming for real-time telemetry
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;

upstream backend_upstream {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name codesentinel.internal _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codesentinel.internal _;

    # TLS 1.3 Configuration
    ssl_certificate /etc/nginx/certs/codesentinel.crt;
    ssl_certificate_key /etc/nginx/certs/codesentinel.key;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: https:;" always;

    # Maximum payload size (GitHub webhook payloads bounded <= 10 MiB)
    client_max_body_size 10M;

    # Real-time SSE Telemetry Streaming (Unbuffered)
    location ~ ^/api/v1/runs/[^/]+/events$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Disable buffering for live streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GitHub Webhook Intake (Rate Limited & Protected)
    location /api/v1/webhooks/github {
        limit_req zone=webhook_zone burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Endpoints
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics (Prometheus Scrape Gateway)
    location /metrics {
        # Allow internal network scraping only
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health Probes
    location ~ ^/api/v1/health/(live|ready)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend Single Page Application
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
